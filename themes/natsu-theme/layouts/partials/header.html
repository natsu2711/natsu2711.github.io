<header>
    <h1><a href="/" style="color: white; text-decoration: none;">{{ .Site.Title }}</a></h1>
    <nav>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="nav-btn {{ if $.IsMenuCurrent "main" . }}active{{ end }}">
            {{ .Name }}
        </a>
        {{ end }}
    </nav>
</header>
